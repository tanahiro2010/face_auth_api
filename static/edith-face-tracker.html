<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDITH Face Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #030807;
      color: #dfffee;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(0, 255, 136, 0.10), transparent 38%),
        #030807;
    }

    main {
      width: min(1180px, 100%);
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 auto 0 0;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.08em;
    }

    button {
      border: 1px solid #00ff88;
      border-radius: 8px;
      padding: 10px 18px;
      background: rgba(0, 255, 136, 0.12);
      color: #dfffee;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: rgba(0, 255, 136, 0.22); }
    button:disabled { cursor: wait; opacity: 0.55; }

    label {
      display: flex;
      align-items: center;
      gap: 7px;
      user-select: none;
    }

    input[type="text"] {
      min-width: 150px;
      border: 1px solid rgba(0, 255, 136, 0.42);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.34);
      color: #dfffee;
      font: inherit;
    }

    input[type="text"]::placeholder { color: #6f9384; }

    .identity-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid rgba(0, 255, 136, 0.24);
      border-radius: 8px;
      background: rgba(0, 12, 8, 0.56);
    }

    .identity-panel button {
      padding: 9px 13px;
    }

    .identity-message {
      min-width: min(100%, 260px);
      margin: 0;
      color: #b8ffd8;
      font-size: 13px;
    }

    .identity-message.error { color: #ffb4b4; }

    .viewport {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 136, 0.38);
      border-radius: 14px;
      background: #000;
      box-shadow: 0 0 42px rgba(0, 255, 136, 0.08);
    }

    video { display: none; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .status {
      position: absolute;
      inset: auto 12px 12px 12px;
      width: fit-content;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.72);
      color: #b8ffd8;
      font-size: 13px;
    }

    .status.error { color: #ffb4b4; }

    .debug-previews {
      position: absolute;
      right: 12px;
      bottom: 52px;
      z-index: 2;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 96px;
      gap: 8px;
      align-items: end;
      max-width: calc(100% - 24px);
      overflow-x: auto;
      pointer-events: none;
    }

    .face-preview {
      display: grid;
      gap: 4px;
      width: 96px;
      padding: 6px;
      border: 1px solid rgba(0, 255, 136, 0.44);
      border-radius: 8px;
      background: rgba(1, 9, 7, 0.74);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.12);
    }

    .face-preview canvas {
      width: 84px;
      height: 84px;
      border-radius: 5px;
      background: #000;
      aspect-ratio: 1 / 1;
    }

    .face-preview span {
      overflow: hidden;
      color: #b8ffd8;
      font-size: 11px;
      line-height: 1.2;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      margin: 12px 2px 0;
      color: #8eada0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>EDITH // FACE TRACKER</h1>
      <label><input id="mirror" type="checkbox" checked /> 鏡像表示</label>
      <label><input id="showBox" type="checkbox" checked /> 顔枠</label>
      <button id="startButton" type="button">カメラを開始</button>
    </div>

    <div class="identity-panel">
      <label>
        名前
        <input id="registerName" type="text" placeholder="例: yamada" autocomplete="off" />
      </label>
      <button id="registerButton" type="button" disabled>現在の顔を登録</button>
      <button id="identifyButton" type="button" disabled>現在の顔を識別</button>
      <label><input id="autoIdentify" type="checkbox" checked /> 自動識別</label>
      <label><input id="autoLearn" type="checkbox" checked /> 角度サンプルを自動追加</label>
      <p id="identityStatus" class="identity-message">顔を検出すると登録・識別できます</p>
    </div>

    <div class="viewport">
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="canvas" width="1280" height="720"></canvas>
      <div id="facePreviews" class="debug-previews" aria-label="aligned face previews"></div>
      <p id="status" class="status">「カメラを開始」を押してください</p>
    </div>

    <p class="hint">
      カメラはブラウザ内だけで処理されます。動作には HTTPS または localhost が必要です。
    </p>
  </main>

  <script type="module">
    import {
      FaceDetector,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
    const WASM_URL =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";

    const UNKNOWN_NAME = "Unknown";
    const SMOOTHING = 0.22;
    const MAX_MATCH_DISTANCE = 240;
    const TRACK_LIFETIME_MS = 5000;
    const PREVIEW_SIZE = 112;
    const API_FACE_SIZE = 512;
    const PREVIEW_CROP_SCALE = 1.55;
    const API_CROP_SCALE = 2.35;
    const API_WIDE_CROP_SCALE = 3.2;
    const IDENTIFY_INTERVAL_MS = 2600;
    const SAMPLE_INTERVAL_MS = 900;
    const SAMPLE_ROLL_DELTA = 7 * Math.PI / 180;
    const SAMPLE_YAW_DELTA = 0.10;
    const API_BASE = "";

    const video = document.querySelector("#camera");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.querySelector("#startButton");
    const mirrorInput = document.querySelector("#mirror");
    const showBoxInput = document.querySelector("#showBox");
    const status = document.querySelector("#status");
    const facePreviews = document.querySelector("#facePreviews");
    const registerNameInput = document.querySelector("#registerName");
    const registerButton = document.querySelector("#registerButton");
    const identifyButton = document.querySelector("#identifyButton");
    const autoIdentifyInput = document.querySelector("#autoIdentify");
    const autoLearnInput = document.querySelector("#autoLearn");
    const identityStatus = document.querySelector("#identityStatus");

    let detector = null;
    let animationId = null;
    let lastVideoTime = -1;
    let lastDetections = [];
    let lastActiveTracks = [];
    let nextTrackId = 1;
    let registerPending = false;
    const tracks = new Map();
    const previewElements = new Map();
    const alignmentCanvas = document.createElement("canvas");
    alignmentCanvas.width = PREVIEW_SIZE;
    alignmentCanvas.height = PREVIEW_SIZE;
    const alignmentCtx = alignmentCanvas.getContext("2d");
    const apiFaceCanvas = document.createElement("canvas");
    apiFaceCanvas.width = API_FACE_SIZE;
    apiFaceCanvas.height = API_FACE_SIZE;
    const apiFaceCtx = apiFaceCanvas.getContext("2d");

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function setIdentityStatus(message, isError = false) {
      identityStatus.textContent = message;
      identityStatus.classList.toggle("error", isError);
    }

    async function createDetector() {
      const vision = await FilesetResolver.forVisionTasks(WASM_URL);
      const options = {
        baseOptions: {
          modelAssetPath: MODEL_URL,
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        minDetectionConfidence: 0.55,
      };

      try {
        return await FaceDetector.createFromOptions(vision, options);
      } catch (gpuError) {
        console.warn("GPU delegateを使えないためCPUに切り替えます。", gpuError);
        delete options.baseOptions.delegate;
        return FaceDetector.createFromOptions(vision, options);
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("このブラウザはカメラAPIに対応していません。");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user",
        },
        audio: false,
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        if (video.readyState >= 1) resolve();
        else video.addEventListener("loadedmetadata", resolve, { once: true });
      });
      await video.play();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function getAnchor(box) {
      return {
        x: box.originX + box.width / 2,
        y: Math.max(42, box.originY - box.height * 0.16),
      };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function normalizePoint(point) {
      const x = point.x <= 1 ? point.x * canvas.width : point.x;
      const y = point.y <= 1 ? point.y * canvas.height : point.y;
      return { x, y, name: point.name ?? point.categoryName ?? "" };
    }

    function getDetectionKeypoints(detection) {
      return (detection.keypoints ?? detection.normalizedKeypoints ?? []).map(normalizePoint);
    }

    function getEyePair(keypoints) {
      if (keypoints.length < 2) return null;

      const namedEyes = keypoints.filter((point) => /eye/i.test(point.name));
      const candidates = namedEyes.length >= 2 ? namedEyes : keypoints.slice(0, 2);
      const [leftOnImage, rightOnImage] = candidates
        .slice(0, 2)
        .sort((a, b) => a.x - b.x);

      if (!leftOnImage || !rightOnImage) return null;
      return { leftEye: leftOnImage, rightEye: rightOnImage };
    }

    function getRollRadians(keypoints) {
      const eyes = getEyePair(keypoints);
      if (!eyes) return 0;
      return Math.atan2(
        eyes.rightEye.y - eyes.leftEye.y,
        eyes.rightEye.x - eyes.leftEye.x
      );
    }

    function getYawScore(keypoints) {
      const eyes = getEyePair(keypoints);
      const nose = keypoints.find((point) => /nose/i.test(point.name)) ?? keypoints[2];
      if (!eyes || !nose) return 0;

      const eyeMidX = (eyes.leftEye.x + eyes.rightEye.x) / 2;
      const eyeDistance = Math.max(1, eyes.rightEye.x - eyes.leftEye.x);
      return clamp((nose.x - eyeMidX) / eyeDistance, -1, 1);
    }

    function getNamedPoint(keypoints, pattern, fallbackIndex) {
      return keypoints.find((point) => pattern.test(point.name)) ?? keypoints[fallbackIndex] ?? null;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getFaceCenter(box, keypoints) {
      const eyes = getEyePair(keypoints);
      const nose = getNamedPoint(keypoints, /nose/i, 2);
      const mouth = getNamedPoint(keypoints, /mouth/i, 3);
      if (!eyes || !nose) {
        return {
          x: box.originX + box.width / 2,
          y: box.originY + box.height / 2,
        };
      }

      const eyeMid = {
        x: (eyes.leftEye.x + eyes.rightEye.x) / 2,
        y: (eyes.leftEye.y + eyes.rightEye.y) / 2,
      };
      const eyeDistance = Math.max(1, Math.hypot(
        eyes.rightEye.x - eyes.leftEye.x,
        eyes.rightEye.y - eyes.leftEye.y
      ));

      if (mouth) {
        return {
          x: (eyeMid.x * 0.24) + (nose.x * 0.38) + (mouth.x * 0.38),
          y: (eyeMid.y * 0.18) + (nose.y * 0.34) + (mouth.y * 0.48),
        };
      }

      return {
        x: nose.x,
        y: nose.y + eyeDistance * 0.55,
      };
    }

    function getFaceCropSide(box, keypoints, scale) {
      const baseSide = Math.max(box.width, box.height) * scale;
      const eyes = getEyePair(keypoints);
      const nose = getNamedPoint(keypoints, /nose/i, 2);
      const mouth = getNamedPoint(keypoints, /mouth/i, 3);
      const points = [eyes?.leftEye, eyes?.rightEye, nose, mouth].filter(Boolean);
      if (points.length < 2) return baseSide;

      const minX = Math.min(...points.map((point) => point.x));
      const maxX = Math.max(...points.map((point) => point.x));
      const minY = Math.min(...points.map((point) => point.y));
      const maxY = Math.max(...points.map((point) => point.y));
      const landmarkSide = Math.max(maxX - minX, maxY - minY) * scale * 2.15;
      return Math.max(baseSide, landmarkSide);
    }

    function getSquareCrop(box, scale, keypoints = []) {
      const center = getFaceCenter(box, keypoints);
      const side = Math.min(
        getFaceCropSide(box, keypoints, scale),
        canvas.width,
        canvas.height
      );
      const sourceX = clamp(center.x - side / 2, 0, Math.max(0, canvas.width - side));
      const sourceY = clamp(center.y - side / 2, 0, Math.max(0, canvas.height - side));
      return { x: sourceX, y: sourceY, size: side };
    }

    function drawRawCrop(targetCtx, crop, size) {
      targetCtx.clearRect(0, 0, size, size);
      targetCtx.drawImage(
        video,
        crop.x,
        crop.y,
        crop.size,
        crop.size,
        0,
        0,
        size,
        size
      );
    }

    function drawAlignedCrop(targetCtx, crop, roll, size) {
      targetCtx.save();
      targetCtx.clearRect(0, 0, size, size);
      targetCtx.translate(size / 2, size / 2);
      targetCtx.rotate(-roll);
      targetCtx.drawImage(
        video,
        crop.x,
        crop.y,
        crop.size,
        crop.size,
        -size / 2,
        -size / 2,
        size,
        size
      );
      targetCtx.restore();
    }

    function extractAlignedFace(detection, now) {
      const box = detection.boundingBox;
      const keypoints = getDetectionKeypoints(detection);
      const roll = getRollRadians(keypoints);
      const yaw = getYawScore(keypoints);
      const previewCrop = getSquareCrop(box, PREVIEW_CROP_SCALE, keypoints);
      const apiCrop = getSquareCrop(box, API_CROP_SCALE, keypoints);
      const apiWideCrop = getSquareCrop(box, API_WIDE_CROP_SCALE, keypoints);

      drawAlignedCrop(alignmentCtx, previewCrop, roll, PREVIEW_SIZE);
      drawRawCrop(apiFaceCtx, apiCrop, API_FACE_SIZE);

      const faceCanvas = document.createElement("canvas");
      faceCanvas.width = PREVIEW_SIZE;
      faceCanvas.height = PREVIEW_SIZE;
      faceCanvas.getContext("2d").drawImage(alignmentCanvas, 0, 0);

      const apiCanvas = document.createElement("canvas");
      apiCanvas.width = API_FACE_SIZE;
      apiCanvas.height = API_FACE_SIZE;
      apiCanvas.getContext("2d").drawImage(apiFaceCanvas, 0, 0);

      drawRawCrop(apiFaceCtx, apiWideCrop, API_FACE_SIZE);
      const apiWideCanvas = document.createElement("canvas");
      apiWideCanvas.width = API_FACE_SIZE;
      apiWideCanvas.height = API_FACE_SIZE;
      apiWideCanvas.getContext("2d").drawImage(apiFaceCanvas, 0, 0);

      drawAlignedCrop(apiFaceCtx, apiCrop, roll, API_FACE_SIZE);
      const apiAlignedCanvas = document.createElement("canvas");
      apiAlignedCanvas.width = API_FACE_SIZE;
      apiAlignedCanvas.height = API_FACE_SIZE;
      apiAlignedCanvas.getContext("2d").drawImage(apiFaceCanvas, 0, 0);

      drawAlignedCrop(apiFaceCtx, apiWideCrop, roll, API_FACE_SIZE);
      const apiWideAlignedCanvas = document.createElement("canvas");
      apiWideAlignedCanvas.width = API_FACE_SIZE;
      apiWideAlignedCanvas.height = API_FACE_SIZE;
      apiWideAlignedCanvas.getContext("2d").drawImage(apiFaceCanvas, 0, 0);

      return {
        canvas: faceCanvas,
        apiCanvas,
        apiWideCanvas,
        apiAlignedCanvas,
        apiWideAlignedCanvas,
        keypoints,
        roll,
        yaw,
        crop: previewCrop,
        apiCrop,
        apiWideCrop,
        updatedAt: now,
      };
    }

    function updateTracks(detections, now) {
      const unusedTrackIds = new Set(tracks.keys());
      const results = [];

      for (const detection of detections) {
        const box = detection.boundingBox;
        const anchor = getAnchor(box);
        let bestTrack = null;
        let bestDistance = MAX_MATCH_DISTANCE;

        for (const trackId of unusedTrackIds) {
          const candidate = tracks.get(trackId);
          const d = distance(anchor, candidate.target);
          if (d < bestDistance) {
            bestDistance = d;
            bestTrack = candidate;
          }
        }

        if (!bestTrack) {
          bestTrack = {
            id: nextTrackId++,
            x: anchor.x,
            y: anchor.y,
            target: anchor,
            box: { ...box },
            alignedFace: null,
            identity: {
              personId: null,
              name: UNKNOWN_NAME,
              confidence: 0,
              recognizedAt: 0,
              sampleCount: 0,
            },
            identify: {
              pending: false,
              lastTriedAt: 0,
            },
            sampling: {
              pending: false,
              lastTriedAt: 0,
              lastRoll: null,
              lastYaw: null,
            },
            updatedAt: now,
          };
          tracks.set(bestTrack.id, bestTrack);
        } else {
          unusedTrackIds.delete(bestTrack.id);
          bestTrack.target = anchor;
          bestTrack.x += (anchor.x - bestTrack.x) * SMOOTHING;
          bestTrack.y += (anchor.y - bestTrack.y) * SMOOTHING;
          bestTrack.box.originX += (box.originX - bestTrack.box.originX) * SMOOTHING;
          bestTrack.box.originY += (box.originY - bestTrack.box.originY) * SMOOTHING;
          bestTrack.box.width += (box.width - bestTrack.box.width) * SMOOTHING;
          bestTrack.box.height += (box.height - bestTrack.box.height) * SMOOTHING;
          bestTrack.updatedAt = now;
        }

        bestTrack.alignedFace = extractAlignedFace(detection, now);
        results.push(bestTrack);
      }

      for (const [id, track] of tracks) {
        if (now - track.updatedAt > TRACK_LIFETIME_MS) {
          tracks.delete(id);
          removePreview(id);
        }
      }

      return results;
    }

    function screenX(x) {
      return mirrorInput.checked ? canvas.width - x : x;
    }

    function getPrimaryTrack() {
      if (!lastActiveTracks.length) return null;
      return [...lastActiveTracks].sort(
        (a, b) => b.box.width * b.box.height - a.box.width * a.box.height
      )[0];
    }

    function updateIdentityControls() {
      const hasFace = Boolean(getPrimaryTrack()?.alignedFace);
      registerButton.disabled = !hasFace || registerPending;
      identifyButton.disabled = !hasFace;
    }

    function drawCamera() {
      ctx.save();
      if (mirrorInput.checked) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function drawHud(track) {
      const x = screenX(track.x);
      const y = track.y;
      const box = track.box;

      if (showBoxInput.checked) {
        const boxX = mirrorInput.checked
          ? canvas.width - box.originX - box.width
          : box.originX;

        ctx.strokeStyle = "rgba(0, 255, 136, 0.82)";
        ctx.lineWidth = Math.max(2, canvas.width / 640);
        ctx.strokeRect(boxX, box.originY, box.width, box.height);
      }

      const fontSize = Math.max(18, Math.min(32, box.width * 0.15));
      ctx.font = `700 ${fontSize}px Inter, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const label = track.identity?.name ?? UNKNOWN_NAME;
      const rollDegrees = track.alignedFace
        ? Math.round((track.alignedFace.roll * 180) / Math.PI)
        : 0;
      const confidence = track.identity?.confidence
        ? ` ${track.identity.confidence.toFixed(2)}`
        : "";
      const text = `${label}${confidence}  #${String(track.id).padStart(2, "0")}  ${rollDegrees}°`;
      const textWidth = ctx.measureText(text).width;
      const width = textWidth + 28;
      const height = fontSize + 18;
      const top = Math.max(4, y - height);

      ctx.fillStyle = "rgba(2, 17, 12, 0.78)";
      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x - width / 2, top, width, height, 7);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#dfffee";
      ctx.fillText(text, x, top + height / 2);

      ctx.fillStyle = "#00ff88";
      ctx.beginPath();
      ctx.arc(x, Math.min(canvas.height - 5, top + height + 8), 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function getPreviewElement(trackId) {
      let preview = previewElements.get(trackId);
      if (preview) return preview;

      const wrapper = document.createElement("div");
      wrapper.className = "face-preview";

      const previewCanvas = document.createElement("canvas");
      previewCanvas.width = PREVIEW_SIZE;
      previewCanvas.height = PREVIEW_SIZE;

      const label = document.createElement("span");
      wrapper.append(previewCanvas, label);
      facePreviews.append(wrapper);

      preview = {
        wrapper,
        canvas: previewCanvas,
        ctx: previewCanvas.getContext("2d"),
        label,
      };
      previewElements.set(trackId, preview);
      return preview;
    }

    function removePreview(trackId) {
      const preview = previewElements.get(trackId);
      if (!preview) return;
      preview.wrapper.remove();
      previewElements.delete(trackId);
    }

    function drawAlignedFacePreviews(activeTracks) {
      const activeIds = new Set(activeTracks.map((track) => track.id));
      for (const trackId of previewElements.keys()) {
        if (!activeIds.has(trackId)) removePreview(trackId);
      }

      for (const track of activeTracks) {
        if (!track.alignedFace) continue;
        const preview = getPreviewElement(track.id);
        preview.ctx.clearRect(0, 0, PREVIEW_SIZE, PREVIEW_SIZE);
        preview.ctx.drawImage(track.alignedFace.canvas, 0, 0);
        const rollDegrees = Math.round((track.alignedFace.roll * 180) / Math.PI);
        preview.label.textContent = `#${String(track.id).padStart(2, "0")} ${track.identity.name} ${rollDegrees}°`;
      }
    }

    function canvasToBlob(sourceCanvas) {
      return new Promise((resolve, reject) => {
        sourceCanvas.toBlob(
          (blob) => {
            if (blob) resolve(blob);
            else reject(new Error("顔画像の作成に失敗しました"));
          },
          "image/jpeg",
          0.92
        );
      });
    }

    async function postFaceImage(path, blob, extraFields = {}) {
      const formData = new FormData();
      for (const [key, value] of Object.entries(extraFields)) {
        formData.append(key, value);
      }
      formData.append("image", blob, "aligned-face.jpg");

      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        body: formData,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.detail || `API request failed: ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function postTrackFace(path, track, extraFields = {}) {
      const candidates = [
        ["raw", track.alignedFace.apiCanvas],
        ["wide", track.alignedFace.apiWideCanvas],
        ["aligned", track.alignedFace.apiAlignedCanvas],
        ["wide-aligned", track.alignedFace.apiWideAlignedCanvas],
      ].filter(([, candidateCanvas]) => candidateCanvas);
      const retryableStatuses = path === "/faces/identify" ? [404, 422] : [422];

      let lastError = null;
      for (const [variant, candidateCanvas] of candidates) {
        try {
          const blob = await canvasToBlob(candidateCanvas);
          return await postFaceImage(path, blob, {
            ...extraFields,
            crop_variant: variant,
          });
        } catch (error) {
          lastError = error;
          if (!retryableStatuses.includes(error.status)) throw error;
        }
      }
      throw lastError ?? new Error("顔画像の送信に失敗しました");
    }

    function applyIdentity(track, person, confidence, now) {
      track.identity = {
        personId: person?.id ?? track.identity?.personId ?? null,
        name: person?.name ?? UNKNOWN_NAME,
        confidence: confidence ?? 0,
        recognizedAt: now,
        sampleCount: person?.sample_count ?? track.identity?.sampleCount ?? 0,
      };
    }

    function clearIdentity(track, now) {
      track.identity = {
        personId: null,
        name: UNKNOWN_NAME,
        confidence: 0,
        recognizedAt: now,
        sampleCount: 0,
      };
    }

    function markPoseSampled(track, now) {
      if (!track.alignedFace) return;
      track.sampling.lastRoll = track.alignedFace.roll;
      track.sampling.lastYaw = track.alignedFace.yaw;
      track.sampling.lastTriedAt = now;
    }

    async function registerPrimaryFace() {
      const track = getPrimaryTrack();
      const name = registerNameInput.value.trim();

      if (!track?.alignedFace) {
        setIdentityStatus("登録できる顔がありません", true);
        return;
      }
      if (!name) {
        setIdentityStatus("登録する名前を入力してください", true);
        registerNameInput.focus();
        return;
      }

      registerPending = true;
      updateIdentityControls();
      setIdentityStatus(`#${String(track.id).padStart(2, "0")} を登録しています…`);

      try {
        const person = await postTrackFace("/faces/register", track, {
          name,
          info: JSON.stringify({
            source: "edith-face-tracker",
            trackId: track.id,
            roll: track.alignedFace.roll,
          }),
        });
        const now = performance.now();
        applyIdentity(track, person, 1, now);
        markPoseSampled(track, now);
        setIdentityStatus(`登録しました: ${person.name} (${person.sample_count} samples)`);
      } catch (error) {
        console.error(error);
        setIdentityStatus(`登録に失敗しました: ${error.message}`, true);
      } finally {
        registerPending = false;
        updateIdentityControls();
      }
    }

    function hasKnownIdentity(track) {
      return Boolean(track.identity?.personId && track.identity.name !== UNKNOWN_NAME);
    }

    function shouldSampleCurrentPose(track, now) {
      if (!autoLearnInput.checked || !hasKnownIdentity(track) || !track.alignedFace) {
        return false;
      }
      if (
        track.identify?.pending ||
        track.sampling.pending ||
        now - track.sampling.lastTriedAt < SAMPLE_INTERVAL_MS
      ) {
        return false;
      }
      if (track.sampling.lastRoll === null || track.sampling.lastYaw === null) {
        return true;
      }

      const rollDelta = Math.abs(track.alignedFace.roll - track.sampling.lastRoll);
      const yawDelta = Math.abs(track.alignedFace.yaw - track.sampling.lastYaw);
      return rollDelta >= SAMPLE_ROLL_DELTA || yawDelta >= SAMPLE_YAW_DELTA;
    }

    async function sampleKnownTrackPose(track) {
      const now = performance.now();
      if (!shouldSampleCurrentPose(track, now)) return;

      track.sampling.pending = true;
      track.sampling.lastTriedAt = now;

      try {
        const result = await postTrackFace(`/faces/${track.identity.personId}/samples`, track, {
          source: "edith-face-tracker",
        });
        const after = performance.now();
        applyIdentity(track, result.person, track.identity.confidence, after);
        if (result.sample_added) {
          markPoseSampled(track, after);
          setIdentityStatus(
            `角度サンプル追加: ${result.person.name} (${result.person.sample_count} samples)`
          );
        } else {
          markPoseSampled(track, after);
        }
      } catch (error) {
        track.sampling.lastTriedAt = performance.now();
        if (error.status && error.status !== 422 && error.status !== 404) {
          console.warn(error);
        }
      } finally {
        track.sampling.pending = false;
      }
    }

    async function identifyTrack(track, { manual = false } = {}) {
      if (!track?.alignedFace || track.identify?.pending) return;

      const now = performance.now();
      if (!manual && now - track.identify.lastTriedAt < IDENTIFY_INTERVAL_MS) return;
      if (!manual && hasKnownIdentity(track)) return;

      track.identify.pending = true;
      track.identify.lastTriedAt = now;
      if (manual) {
        setIdentityStatus(`#${String(track.id).padStart(2, "0")} を識別しています…`);
      }

      try {
        const result = await postTrackFace("/faces/identify", track, {
          auto_enroll: String(autoLearnInput.checked),
          source: "edith-face-tracker",
        });
        applyIdentity(track, result.person, result.similarity, performance.now());
        const learned = result.sample_added ? " / angle learned" : "";
        setIdentityStatus(
          `識別しました: ${result.person.name} (${result.similarity.toFixed(3)})${learned}`
        );
      } catch (error) {
        if (!hasKnownIdentity(track)) {
          clearIdentity(track, performance.now());
        }
        if (manual) {
          console.warn(error);
          setIdentityStatus(`識別できませんでした: ${error.message}`, true);
        } else if (!error.status || error.status === 405 || error.status === 501) {
          autoIdentifyInput.checked = false;
          setIdentityStatus("APIに接続できないため自動識別を停止しました", true);
        }
      } finally {
        track.identify.pending = false;
      }
    }

    function identifyPrimaryFace() {
      const track = getPrimaryTrack();
      if (!track?.alignedFace) {
        setIdentityStatus("識別できる顔がありません", true);
        return;
      }
      identifyTrack(track, { manual: true });
    }

    function identifyTracks(activeTracks) {
      if (!autoIdentifyInput.checked) return;
      for (const track of activeTracks) identifyTrack(track);
    }

    function sampleKnownTrackPoses(activeTracks) {
      if (!autoLearnInput.checked) return;
      for (const track of activeTracks) sampleKnownTrackPose(track);
    }

    function render() {
      const now = performance.now();
      drawCamera();

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = detector.detectForVideo(video, now);
        lastDetections = result.detections ?? [];
      }

      const activeTracks = updateTracks(lastDetections, now);
      lastActiveTracks = activeTracks;
      for (const track of activeTracks) drawHud(track);
      drawAlignedFacePreviews(activeTracks);
      updateIdentityControls();
      identifyTracks(activeTracks);
      sampleKnownTrackPoses(activeTracks);

      setStatus(
        activeTracks.length
          ? `${activeTracks.length} face${activeTracks.length === 1 ? "" : "s"} detected`
          : "顔を探しています…"
      );

      animationId = requestAnimationFrame(render);
    }

    async function start() {
      startButton.disabled = true;
      setStatus("モデルとカメラを準備しています…");

      try {
        detector ??= await createDetector();
        await startCamera();
        startButton.textContent = "実行中";
        if (animationId) cancelAnimationFrame(animationId);
        render();
      } catch (error) {
        console.error(error);
        setStatus(
          error.name === "NotAllowedError"
            ? "カメラの使用が拒否されました。ブラウザの権限設定を確認してください。"
            : `開始できませんでした: ${error.message}`,
          true
        );
        startButton.disabled = false;
        startButton.textContent = "もう一度試す";
      }
    }

    startButton.addEventListener("click", start);
    registerButton.addEventListener("click", registerPrimaryFace);
    identifyButton.addEventListener("click", identifyPrimaryFace);

    window.addEventListener("beforeunload", () => {
      if (animationId) cancelAnimationFrame(animationId);
      for (const track of video.srcObject?.getTracks?.() ?? []) track.stop();
      detector?.close();
    });
  </script>
</body>
</html>
